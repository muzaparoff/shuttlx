appId: ${APP_ID}
---
- runFlow: ../common/onboard.yaml
- tapOn: "Programs & plans"
- tapOn: "Start Run/Walk"
- runFlow: ../common/motion-prompt.yaml
- assertVisible: "ELAPSED"
- extendedWaitUntil: { visible: "Pause workout", timeout: 10000 }
- tapOn: "More"
- tapOn: "Discard workout"
- tapOn: "Discard"
- runFlow: ../common/motion-prompt.yaml
- assertNotVisible: "ELAPSED"
- assertVisible: "Mixed"   # back on Programs, not the timer
- back
- tapOn: "History"
- tapOn: "List"
- assertVisible: "No sessions this month"
