name: 🚀 Deploy

# Filename kept from the pre-kit pipeline so github.run_number continues; the
# TestFlight build counter runs at run_number + 33 (last pre-kit build 226 at
# run 193). Secret names mapped — this repo predates the kit's standard set.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Archive and export only — do NOT upload to TestFlight"
        type: boolean
        required: false
        default: true

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    uses: muzaparoff/appstore-kit/.github/workflows/release.yml@v1
    permissions:
      contents: read
      actions: write
    with:
      project: ShuttlX.xcodeproj
      scheme: ShuttlX
      app_name: ShuttlX
      build_number_offset: 33
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    secrets:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      IOS_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
      KEY: ${{ secrets.P12_PASSWORD }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
      WIDGET_PROVISIONING_PROFILE_BASE64: ${{ secrets.WIDGETS_PROVISIONING_PROFILE_BASE64 }}
      WATCH_PROVISIONING_PROFILE_BASE64: ${{ secrets.WATCH_PROVISIONING_PROFILE_BASE64 }}
      WATCH_WIDGETS_PROVISIONING_PROFILE_BASE64: ${{ secrets.WATCH_WIDGETS_PROVISIONING_PROFILE_BASE64 }}
      LIVEACTIVITY_PROVISIONING_PROFILE_BASE64: ${{ secrets.LIVEACTIVITY_PROVISIONING_PROFILE_BASE64 }}
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
