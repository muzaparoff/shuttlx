name: 📝 Site Release Notes

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.1.57)"
        required: true
        type: string

concurrency:
  group: site-release-notes
  cancel-in-progress: false

jobs:
  publish:
    uses: muzaparoff/appstore-kit/.github/workflows/site-release-notes.yml@v1
    permissions:
      contents: write
    with:
      tag: ${{ inputs.tag }}
    secrets: inherit
