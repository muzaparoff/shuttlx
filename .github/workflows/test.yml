name: 🧪 CI

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    uses: muzaparoff/appstore-kit/.github/workflows/ci.yml@v1
    permissions:
      contents: write
      actions: write
    with:
      project: ShuttlX.xcodeproj
      scheme: ShuttlX
      release_workflow: deploy.yml
      site_notes_workflow: site-release-notes.yml
      # Migration default — flip to full tests once verified locally.
      run_tests: false
      warnings_gate: false
    secrets: inherit
